        name: Castle Morne + Leonine Misbegotten
        hint: Weeping Peninsula. Irina/Edgar quest, Grafted Blade Greatsword.
      - id: tower-return
        kind: area
        name: Tower of Return
        hint: Weeping Peninsula chest teleports you to Leyndell for an early Great Rune / Erdtree's Favor talisman.
      - id: radahn-prep
        kind: quest
        name: Radahn prep checklist
        hint: L65–70, Vigor 40, all summon signs used and re-used, Rock Sling from Torrent. Then go.
