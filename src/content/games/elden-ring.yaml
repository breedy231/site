# Game definition for the tracker at /games/elden-ring.
# Progress lives in Netlify Blobs, not here. Add a new game = add a new YAML file.
slug: elden-ring
title: Elden Ring
character: Crim — sorcery run
steam:
  appid: 1245620
links:
  map: https://mapgenie.io/elden-ring/maps/the-lands-between?search={q}
  wiki: https://eldenring.wiki.fextralife.com/{q+}
