        kind: item
        name: "Limgrave/Weeping sweep: every church"
        hint: Churches = Sacred Tears (flask potency). Elleh, Dragon Communion, Pilgrimage, Fourth Church of Marika, Callu Baptismal.
      - id: sweep-saplings
        kind: item
        name: "Limgrave/Weeping sweep: golden saplings"
        hint: Erdtree saplings = Golden Seeds (flask charges). Stormhill, Third Church, Fort Haight, Weeping Peninsula.
