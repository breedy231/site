        kind: area
        name: "Level: Vigor to 35"
        hint: Step 1 of the plan. Survive first, then damage.
      - id: lvl-int52
        kind: area
        name: "Level: Int to 52"
        hint: Step 2. Unlocks Lusat's Staff and most late sorceries.
      - id: lvl-vig40
        kind: area
        name: "Level: Vigor to 40"
        hint: Step 3. Soft cap; do this before Radahn.
      - id: lvl-int60
        kind: area
        name: "Level: Int to 60"
        hint: Step 4. Damage soft cap for scaling.
      - id: lvl-mind28
        kind: area
        name: "Level: Mind to 28"
        hint: Step 5. Enough FP for Comet spam with Cerulean flask.
