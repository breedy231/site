# Game definition for the tracker at /games/metroid-prime-remastered.
# Progress lives in Netlify Blobs, not here. Switch game: no Steam sync, all manual.
# Pickup list (100 items) is the vanilla layout, cross-checked against Randovania's
# Prime 1 logic database. Expansion names lead with the room so the wiki link lands
# on the room page, which explains how to reach it.
slug: metroid-prime-remastered
title: Metroid Prime Remastered
character: Switch — manual tracking
links:
  wiki: https://metroid.fandom.com/wiki/{q}
kinds:
  upgrade: { label: Upgrade, color: amber }
  etank: { label: Energy Tank, color: green }
  missile: { label: Missile, color: orange }
  pbomb: { label: Power Bomb, color: purple }
  artifact: { label: Artifact, color: sky }
  scan: { label: Scan, color: gray }
# Suggested path from where I am now. Update this when I get stuck.
route:
  - research-core-escape
  - thardus
  - spider-ball
stats:
  - key: pct
    label: Items %
  - key: hrs
    label: Hours
notes: |
  **Research Core escape**

  - Keep the **Thermal Visor** on the whole way. The lights are out and Shadow Pirates are invisible without it.
  - The drones are **Sentry Drones** (they scramble your visor). Charged **Wave Beam** kills them fast.
  - Dead door? Find its **Power Conduit** in Thermal and shoot it with the **Wave Beam**.
  - Metroids drain energy fast. If one latches on, go to **Morph Ball and lay a bomb** to shake it off.
  - **Run.** Don't clear rooms; nothing in there is worth the energy.

  **Pick up more Energy Tanks.** You only have 1.
